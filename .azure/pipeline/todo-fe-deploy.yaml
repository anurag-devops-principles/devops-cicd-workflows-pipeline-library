parameters:
  - name: jobName
    type: string
    default: ""

  - name: envName
    type: string
    default: ""

stages:
  - stage: applicationDeploy
    displayName: "TODO FE Deployment"
    jobs:
      - job: deployToVm
        displayName: ${{ parameters.jobName }}
        environment:
          name: ${{ parameters.envName }}
          resourceType: VirtualMachine
        strategy:
          runOnce:
            deploy:
              steps:

                - task: DownloadPipelineArtifact@2
                  displayName: "Download Build Artifacts"
                  inputs:
                    buildType: current
                    artifactName: "todo-ui-build"
                    targetPath: '${Pipeline.Workspace}'

                - task: Bash@3
                  displayName: 'React Artifact Deployment'
                  inputs:
                    targetType: 'inline'
                    script: |
                      sudo systemctl stop nginx
                      sudo rm -tf /var/www/html
                      sudo cp ${Pipeline.Workspace}/* /var/www/html
                      sudo systemctl start nginx
